<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254">
  <title>Medical Card — Vector Recreation</title>
  <desc>Editable vector recreation of the supplied green medical folder icon.</desc>
  <defs>
    <linearGradient id="backFolder" x1="0.03" y1="0.05" x2="0.96" y2="0.98">
      <stop offset="0" stop-color="#03D995"/>
      <stop offset="0.3" stop-color="#00B983"/>
      <stop offset="0.66" stop-color="#008767"/>
      <stop offset="1" stop-color="#00614F"/>
    </linearGradient>
    <linearGradient id="frontFolder" x1="0.02" y1="0.04" x2="0.98" y2="0.96">
      <stop offset="0" stop-color="#3AED98"/>
      <stop offset="0.22" stop-color="#12D78A"/>
      <stop offset="0.56" stop-color="#00B77D"/>
      <stop offset="1" stop-color="#006A5A"/>
    </linearGradient>
    <linearGradient id="paper" x1="0.18" y1="0" x2="0.86" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#FAFCFC"/>
      <stop offset="1" stop-color="#F0F6F5"/>
    </linearGradient>
    <linearGradient id="paperLines" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B1C9C2"/>
      <stop offset="1" stop-color="#A1C2B9"/>
    </linearGradient>
    <linearGradient id="labelLines" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3FFF0"/>
      <stop offset="1" stop-color="#CBF8E5"/>
    </linearGradient>
    <linearGradient id="crossFill" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECF9F3"/>
    </linearGradient>
    <filter id="softShadow" x="-12%" y="-12%" width="124%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feOffset dy="9" dx="1" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="crossShadow" x="-30%" y="-25%" width="170%" height="175%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset dx="5" dy="7" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="darkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3B33"/>
      <stop offset="1" stop-color="#030C0B"/>
    </linearGradient>
  </defs>
  <rect width="1254" height="1254" fill="url(#darkBg)"/>
  <g filter="url(#softShadow)">
    <!-- Single outer green folder -->
    <path transform="translate(2 627) scale(1 1.2) translate(0 -742.5)" d="M141 499C141 441 180 401 238 401H423C460 401 480 415 507 450L535 483C554 505 579 515 609 515H1008C1069 515 1109 554 1109 615V977C1109 1040 1070 1084 1007 1084H250C187 1084 141 1040 141 977Z" fill="url(#frontFolder)"/>
    <!-- Centered white medical cross -->
    <path transform="translate(-204 -125)" filter="url(#crossShadow)" d="M798 654H864C883 654 894 667 894 685V755H964C983 755 995 768 995 787V851C995 870 983 882 964 882H894V955C894 974 882 986 864 986H798C780 986 767 974 767 955V882H697C679 882 667 870 667 851V787C667 768 679 755 697 755H767V685C767 667 780 654 798 654Z" fill="url(#crossFill)"/>
  </g>
</svg>
